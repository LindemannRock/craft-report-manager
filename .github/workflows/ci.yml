name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: craft
          MYSQL_USER: db
          MYSQL_PASSWORD: db
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6

      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install system packages
        run: apt-get update && apt-get install -y --no-install-recommends git unzip libicu-dev libzip-dev default-mysql-client

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: --prefer-dist
          ignore-cache: yes

      - name: Complete package quality gate
        run: composer quality-gate
